[package]
name = "pure-goal"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Codex-style goal mode for the pure Rust agent: a persistent, context-injected goal the model keeps advancing turn over turn"
readme = "README.md"
keywords = ["pure", "goal", "objective", "autonomous", "plugin"]
categories = ["development-tools"]

[package.metadata.pure.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
