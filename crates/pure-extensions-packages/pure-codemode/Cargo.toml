[package]
name = "pure-codemode"
version = "0.1.15"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded native JavaScript tool programs for the pure Rust agent"
readme = "README.md"
keywords = ["pure", "javascript", "tools", "plugin"]
categories = ["development-tools"]

[package.metadata.pure.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
rquickjs = { version = "=0.8.1", default-features = false, features = ["allocator"] }
