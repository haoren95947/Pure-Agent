[package]
name = "pure-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
documentation = "https://docs.rs/pure-extensions"
description = "Rust-native (cdylib) plugin loader + AgentTool adapter for pure — libloading + spawn_blocking ABI bridge"
readme = "README.md"
keywords = ["agent", "llm", "ai", "plugin", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
pure-plugin-sdk = { workspace = true }
pure-ai = { workspace = true }
pure-agent = { workspace = true }
libloading = "0.8"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
provider-performance = ["pure-plugin-sdk/provider"]
